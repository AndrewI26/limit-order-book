# Install once with: pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Formatting (Google style via .clang-format).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # Google's style linter (configured in CPPLINT.cfg).
  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint

  # Static analysis + Google naming rules (configured in .clang-tidy).
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: scripts/clang-tidy.sh
        language: system
        files: \.(cc|cpp|cxx)$
